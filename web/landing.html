<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stashway</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .page {
    position: relative;
    width: 1280px; height: 720px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
  }
  /* ambient mint glow behind hero mark */
  .glow {
    position: absolute;
    left: 50%; top: -8%;
    transform: translateX(-50%);
    width: 920px; height: 520px;
    background:
      radial-gradient(ellipse 55% 45% at 50% 42%, rgba(61,220,151,.55), transparent 70%),
      radial-gradient(ellipse 70% 55% at 50% 35%, rgba(61,220,151,.22), transparent 75%),
      radial-gradient(ellipse 40% 30% at 50% 55%, rgba(20,180,120,.18), transparent 70%);
    filter: blur(8px);
    pointer-events: none;
    z-index: 0;
  }
  .hero-mark-wrap {
    position: absolute;
    left: 50%; top: -14%;
    transform: translateX(-50%);
    width: 900px; height: 480px;
    display: flex; align-items: flex-start; justify-content: center;
    z-index: 1;
    pointer-events: none;
  }
  .hero-mark {
    width: 640px; height: 640px;
    object-fit: contain;
    filter:
      drop-shadow(0 0 28px rgba(61,220,151,.75))
      drop-shadow(0 0 80px rgba(61,220,151,.45))
      drop-shadow(0 0 140px rgba(61,220,151,.28));
    opacity: .96;
  }
  /* soft vignette so mark fades into black like Circa torus crop */
  .hero-fade {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 42%, #000 68%);
    z-index: 2;
    pointer-events: none;
  }
  .nav {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 36px 0;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: #fff;
  }
  .logo img { width: 22px; height: 22px; display: block; }
  .logo span { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-pill {
    display: flex; align-items: center; gap: 2px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 999px;
    padding: 4px;
    backdrop-filter: blur(12px);
  }
  .nav-pill a {
    color: rgba(255,255,255,.72);
    text-decoration: none;
    font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px;
  }
  .nav-pill a:hover { color: #fff; background: rgba(255,255,255,.06); }
  .btn-connect {
    background: #fff; color: #0a0a0a;
    border: none; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    padding: 10px 18px; cursor: pointer;
    text-decoration: none;
  }
  .hero {
    position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    padding-top: 252px;
  }
  .headline {
    font-size: 104px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: .95;
    background: linear-gradient(180deg, #f4fff9 0%, #9aefc7 55%, #3DDC97 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
  }
  .headline .cursor {
    display: inline-block;
    width: 3px; height: .72em;
    margin-left: 6px;
    background: #fff;
    vertical-align: -2px;
    border-radius: 1px;
    opacity: .9;
  }
  .sub {
    margin-top: 18px;
    max-width: 420px;
    font-size: 15px;
    font-weight: 450;
    line-height: 1.45;
    color: rgba(255,255,255,.88);
  }
  .cta {
    margin-top: 28px;
    background: #fff; color: #0a0a0a;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 600;
    padding: 14px 28px;
    text-decoration: none;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="glow" aria-hidden="true"></div>
    <div class="hero-mark-wrap" aria-hidden="true">
      <img class="hero-mark" src="assets/mark-hero.png" alt=""/>
    </div>
    <div class="hero-fade" aria-hidden="true"></div>

    <header class="nav">
      <a class="logo" href="#">
        <img src="assets/mark-mint.png" alt=""/>
        <span>Stashway</span>
      </a>
      <div class="nav-right">
        <nav class="nav-pill">
          <a href="#product">Product</a>
          <a href="https://stashway-arena.vercel.app">Arena</a>
          <a href="https://github.com/defiprince-bit/stashway">Docs</a>
        </nav>
        <a class="btn-connect" href="https://stashway-arena.vercel.app">Open app</a>
      </div>
    </header>

    <main class="hero">
      <h1 class="headline">Vault<span class="cursor" aria-hidden="true"></span></h1>
      <p class="sub">AI can manage your money — Stashway puts it on a leash so the agent can’t drain you.</p>
      <a class="cta" href="https://stashway-arena.vercel.app">Get started now</a>
    </main>
  </div>
</body>
</html>
